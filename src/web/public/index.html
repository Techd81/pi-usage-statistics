<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>使用统计</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>使用统计</h1>
      <p class="subtitle">Pi Agent Token 使用与成本统计 · 数据仅保存在本机</p>
    </header>

    <section class="controls" aria-label="筛选条件">
      <label class="control">
        <span class="control-label">来源</span>
        <select id="filter-provider"></select>
      </label>
      <label class="control">
        <span class="control-label">模型</span>
        <select id="filter-model"></select>
      </label>
      <label class="control">
        <span class="control-label">项目</span>
        <select id="filter-project"></select>
      </label>
      <label class="control">
        <span class="control-label">会话</span>
        <select id="filter-session"></select>
      </label>
      <label class="control">
        <span class="control-label">时间范围</span>
        <select id="filter-range">
          <option value="today" selected>今天</option>
          <option value="24h">近24小时</option>
          <option value="7d">近7天</option>
          <option value="all">全部</option>
        </select>
      </label>
      <label class="control">
        <span class="control-label">间隔</span>
        <select id="filter-interval">
          <option value="30000" selected>30s</option>
          <option value="60000">1m</option>
          <option value="300000">5m</option>
          <option value="900000">15m</option>
          <option value="3600000">1h</option>
        </select>
      </label>
    </section>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section class="overview" aria-label="总览">
      <div class="stat">
        <span class="stat-label">实际消耗 Token</span>
        <span id="stat-tokens" class="stat-value">--</span>
      </div>
      <div class="stat">
        <span class="stat-label">请求数</span>
        <span id="stat-requests" class="stat-value">--</span>
      </div>
      <div class="stat">
        <span class="stat-label">总成本</span>
        <span id="stat-cost" class="stat-value">--</span>
      </div>
    </section>

    <section class="cards" aria-label="使用明细">
      <div class="card">
        <span class="card-label">输入</span>
        <span id="card-input" class="card-value">--</span>
      </div>
      <div class="card">
        <span class="card-label">输出</span>
        <span id="card-output" class="card-value">--</span>
      </div>
      <div class="card">
        <span class="card-label">Cache 创建</span>
        <span id="card-cache-write" class="card-value">--</span>
      </div>
      <div class="card">
        <span class="card-label">Cache 命中</span>
        <span id="card-cache-read" class="card-value">--</span>
      </div>
      <div class="card">
        <span class="card-label">缓存命中率</span>
        <span id="card-hit-rate" class="card-value">--</span>
      </div>
    </section>

    <section class="chart-card" aria-label="使用趋势">
      <div class="chart-header">
        <h2>使用趋势</h2>
        <span id="chart-cost-note" class="chart-note"></span>
      </div>
      <div id="chart" class="chart"></div>
      <div class="legend" id="chart-legend" aria-label="图例">
        <span class="legend-item"><i class="swatch swatch-cost"></i>成本</span>
        <span class="legend-item"><i class="swatch swatch-cache-write"></i>Cache 创建</span>
        <span class="legend-item"><i class="swatch swatch-cache-read"></i>Cache 命中</span>
        <span class="legend-item"><i class="swatch swatch-input"></i>输入</span>
        <span class="legend-item"><i class="swatch swatch-output"></i>输出</span>
      </div>
    </section>

    <footer class="page-footer">
      刷新时间 <span id="refreshed-at">--</span> · 数据来源：本地 Pi 会话
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
